apiVersion: apps/v1
kind: Deployment
metadata:
  name: dra-driver-sandbox-controller
  namespace: default
  labels:
    app.kubernetes.io/name: dra-driver-sandbox
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dra-driver-sandbox
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dra-driver-sandbox
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: dra-driver-sandbox-controller
      containers:
      - name: controller
        image: dra-driver-sandbox-controller
        imagePullPolicy: IfNotPresent
        args:
          - -v=5
