version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "18:00"
    groups:
      k8s.io:
        patterns:
          - k8s.io/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "18:00"
    groups:
      all-actions:
        patterns:
          - "*"
