apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: consumable.sandbox.example.com
spec:
  selectors:
  - cel:
      expression: device.driver == "sandbox.example.com" &&
        device.attributes["sandbox.example.com"].class == "consumable"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consumable-devices
  labels:
    sandbox.example.com/node-local-devices: ""
data:
  devices: |
    - name: consumable0
      attributes:
        class:
          string: consumable
      allowMultipleAllocations: true
      capacity:
        widgets:
          requestPolicy:
            default: 1
            validRange:
              min: 1
              step: 1
          value: 8
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: four-widgets
spec:
  spec:
    devices:
      requests:
      - name: widgets
        exactly:
          deviceClassName: consumable.sandbox.example.com
          capacity:
            requests:
              widgets: 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consumable
  template:
    metadata:
      labels:
        app: consumable
    spec:
      containers:
      - name: ctr
        image: registry.k8s.io/pause:3.10.1
        resources:
          claims:
          - name: claim
      resourceClaims:
      - name: claim
        resourceClaimTemplateName: four-widgets
