apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: test.sandbox.example.com
spec:
  selectors:
  - cel:
      expression: device.driver == "sandbox.example.com" &&
        device.attributes["sandbox.example.com"].class == "test"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-devices
  labels:
    sandbox.example.com/node-local-devices: ""
data:
  devices: |
    - name: dev0
      attributes:
        class:
          string: test
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: one-device
spec:
  spec:
    devices:
      requests:
      - name: dev
        exactly:
          deviceClassName: test.sandbox.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: ctr
        image: registry.k8s.io/pause:3.10.1
        resources:
          claims:
          - name: claim
      resourceClaims:
      - name: claim
        resourceClaimTemplateName: one-device
