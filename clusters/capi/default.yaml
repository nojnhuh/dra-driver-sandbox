apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: default
  namespace: default
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: default-control-plane
    machineInfrastructure:
      templateRef:
        kind: DevMachineTemplate
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        name: default-control-plane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: default-cluster
  workers:
    machineDeployments:
    - class: worker
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: default-worker-bootstraptemplate
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DevMachineTemplate
          name: default-worker-machinetemplate
  variables:
  - name: featureGates
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: ""
        example: "AllBeta=true,DRAWorkloadResourceClaims=true"
        description: "Kubernetes feature gates to enable in kube-apiserver, kube-controller-manager, kube-scheduler, and kubelet."
  - name: runtimeConfig
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: ""
        example: "api/beta=true,scheduling.k8s.io/v1alpha3=true"
        description: "APIs to enable in kube-apiserver via --runtime-config."
  - name: preLoadImages
    required: false
    schema:
      openAPIV3Schema:
        type: array
        items:
          type: string
          example: ubuntu:latest
        default: []
        description: "Images to pre-load onto worker nodes."
  patches:
  - name: commandArgs
    description: "Initializes the command line args for components to an empty list."
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs"
        value: []
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/clusterConfiguration/controllerManager"
        value:
          extraArgs: []
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/clusterConfiguration/scheduler"
        value:
          extraArgs: []
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/initConfiguration"
        value:
          nodeRegistration:
            kubeletExtraArgs: []
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/joinConfiguration"
        value:
          nodeRegistration:
            kubeletExtraArgs: []
    - selector:
        apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
        kind: KubeadmConfigTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - worker
      jsonPatches:
      - op: add
        path: "/spec"
        value:
          template:
            spec:
              joinConfiguration:
                nodeRegistration:
                  kubeletExtraArgs: []
  - name: featureGates
    description: "Sets featureGates in the KubeadmControlPlaneTemplate for kube-apiserver, kube-controller-manager, kube-scheduler, and kubelet."
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-"
        valueFrom:
          template: |
            name: feature-gates
            value: {{ .featureGates }}
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/clusterConfiguration/controllerManager/extraArgs/-"
        valueFrom:
          template: |
            name: feature-gates
            value: {{ .featureGates }}
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/clusterConfiguration/scheduler/extraArgs/-"
        valueFrom:
          template: |
            name: feature-gates
            value: {{ .featureGates }}
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/initConfiguration/nodeRegistration/kubeletExtraArgs/-"
        valueFrom:
          template: |
            name: feature-gates
            value: {{ .featureGates }}
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/joinConfiguration/nodeRegistration/kubeletExtraArgs/-"
        valueFrom:
          template: |
            name: feature-gates
            value: {{ .featureGates }}
    - selector:
        apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
        kind: KubeadmConfigTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - worker
      jsonPatches:
      - op: add
        path: "/spec/template/spec/joinConfiguration/nodeRegistration/kubeletExtraArgs/-"
        valueFrom:
          template: |
            name: feature-gates
            value: {{ .featureGates }}
  - name: runtimeConfig
    description: "Sets the --runtime-config flag for kube-apiserver."
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: "/spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-"
        valueFrom:
          template: |
            name: runtime-config
            value: {{ .runtimeConfig }}
  - name: preLoadImages
    description: "Sets the docker images to pre-load onto worker nodes."
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DevMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - worker
      jsonPatches:
      - op: add
        path: "/spec/template/spec/backend/docker/preLoadImages"
        valueFrom:
          variable: preLoadImages
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevClusterTemplate
metadata:
  name: default-cluster
  namespace: default
---
kind: KubeadmControlPlaneTemplate
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
metadata:
  name: default-control-plane
  namespace: default
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            # host.docker.internal is required by kubetest when running on MacOS because of the way ports are proxied.
            certSANs: [localhost, 127.0.0.1, 0.0.0.0, host.docker.internal]
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: default-control-plane
  namespace: default
spec:
  template:
    spec:
      backend:
        docker:
          extraMounts:
          - containerPath: "/var/run/docker.sock"
            hostPath: "/var/run/docker.sock"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: default-worker-machinetemplate
  namespace: default
spec:
  template:
    spec:
      backend:
        docker:
          extraMounts:
          - containerPath: "/var/run/docker.sock"
            hostPath: "/var/run/docker.sock"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: default-worker-bootstraptemplate
  namespace: default
---
